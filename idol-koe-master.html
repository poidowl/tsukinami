<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>アイドル声マスター</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#151622;color:#f4f1ed;font:16px/1.6 system-ui,sans-serif}main{max-width:740px;margin:auto;padding:36px 20px}header,footer,.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header{border-bottom:1px solid #49495a;padding-bottom:14px}h1{font-size:clamp(20px,4vw,30px);margin:0;letter-spacing:.04em}small,#count{color:#c5c1d8}section{margin:30px 0}.line{background:#252637;border-radius:14px;padding:32px 24px;text-align:center}h2{font-size:clamp(26px,6vw,46px);margin:18px 0}.takes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}button{font:inherit;cursor:pointer;background:#343448;color:inherit;border:1px solid #58576d;border-radius:9px;padding:9px 14px}button:focus-visible{outline:3px solid white}.take{width:100%;padding:18px 3px;font-weight:bold}.choose{background:#efb7cd;color:#241723;width:100%;margin-top:8px;border:0}button:disabled{opacity:.43;cursor:default}summary{cursor:pointer;padding:12px 0}article{margin:8px 0;padding:12px;border:1px solid #464657;border-radius:8px}article button,footer button{font-size:14px;margin:3px}input{padding:9px;width:100%;font:inherit}#msg{min-height:1.7em;color:#ffd0df}details{border-top:1px solid #49495a}footer{margin-top:18px}
</style><main><header><h1>アイドル声マスター</h1><span id="count"></span></header>
<section><div class="line"><small>収録するセリフ</small><h2 id="phrase"></h2></div><p>二つの声を聴いて、本番のテイクを選んでください。</p><div class="takes" id="takes"></div><button id="skip">差がわからない · 次の比較へ</button><p id="msg" role="status"></p></section>
<details><summary>一刀ずつの履歴</summary><div id="history"></div></details>
<details><summary>育てた声で自由に試聴</summary><label>ひらがな・カタカナ（60字まで）<input id="custom" maxlength="60" value="きょう、ちょっときんちょうしてた"></label><button id="try">▶ 今の声で読む</button></details>
<footer><button id="recipe">声のレシピを保存</button><button id="votes">開発協力用の比較履歴を保存</button></footer><small>進行はこのブラウザに自動保存します。比較履歴は自分で共有したときだけ開発に渡ります。</small></main>
<script type="module">
import {makeHitofude, PRESETS, SR} from "./hitofude.mjs";
const version='b205f58ae2620fffec764d1bde3f858fcf294ac8', key='idol-koe-v1';
const lines=['おはよう','おかえり','ありがとう','またあした','ほんと？','ちょっとまって'];
const knobs=[['hz',205,410,25],['fscale',.90,1.25,.065],['rate',.88,1.48,.13],['sigh',0,.85,.21],['tilt_w',3,8,1]];
const $=id=>document.getElementById(id);
function pair(parent,voice,depth){
 const [k,lo,hi,step]=knobs[depth%knobs.length];
 let delta=Math.random()<.5?-step:step;
 if(voice[k]+delta<lo||voice[k]+delta>hi)delta=-delta;
 const other={...voice,[k]:+Math.max(lo,Math.min(hi,voice[k]+delta)).toFixed(4)};
 return {parent,depth,k,text:lines[depth%lines.length],voices:Math.random()<.5?[voice,other]:[other,voice]};
}
function fresh(){const voice={...PRESETS.hitofude};return {version,voice,log:[],next:pair(null,voice,0)}}
let state=fresh(), storageOK=true;
try{const saved=JSON.parse(localStorage.getItem(key));if(saved?.version===version&&Array.isArray(saved.log)&&saved.next?.voices?.length===2)state=saved}catch{}
function save(){try{localStorage.setItem(key,JSON.stringify(state));storageOK=true}catch{storageOK=false}}
let ctx,source,heard=new Set(),token=0;
function stop(){token++;if(source){source.onended=null;source.stop();source=null}}
async function play(text,voice,done){
 stop();const turn=token;
 try{ctx??=new AudioContext();await ctx.resume();if(turn!==token)return;
 const {samples}=makeHitofude(text,voice);const buf=ctx.createBuffer(1,samples.length,SR);buf.copyToChannel(samples,0);
 source=ctx.createBufferSource();source.buffer=buf;source.connect(ctx.destination);
 source.onended=()=>{if(turn===token){source=null;done?.()}};source.start()
 }catch{$('msg').textContent='再生できませんでした。もう一度お試しください。'}
}
function button(label,fn,cls){const b=document.createElement('button');b.textContent=label;b.onclick=fn;if(cls)b.className=cls;return b}
function advance(choice){const p=state.next,id=state.log.length;
 state.log.push({...p,id,choice});if(choice!==null)state.voice=p.voices[choice];
 state.next=pair(id,state.voice,p.depth+1);save();render();}
function fork(p,i){state.voice=p.voices[i];state.next={...pair(p.id,state.voice,p.depth+1),parentTake:i};save();render()}
function render(){stop();heard.clear();const p=state.next;
 $('phrase').textContent='「'+p.text+'」';$('count').textContent='第 '+(p.depth+1)+' 刀';$('takes').replaceChildren();
 $('msg').textContent=storageOK?'':'自動保存できません。レシピを保存してください。';
 $('skip').disabled=true;
 for(const [i,label] of ['A','B'].entries()){const box=document.createElement('div');
 const choose=button(label+' を採用',()=>advance(i),'choose');choose.disabled=true;
 box.append(button('▶ テイク '+label,()=>play(p.text,p.voices[i],()=>{heard.add(i);if(heard.size===2){document.querySelectorAll('.choose').forEach(b=>b.disabled=false);$('skip').disabled=false}}),'take'),choose);$('takes').append(box)}
 $('history').replaceChildren();for(const item of [...state.log].reverse()){const a=document.createElement('article');
 a.append('#'+(item.id+1)+'　'+item.text+'　'+(item.choice===null?'差なし':'採用 '+['A','B'][item.choice])+'　← '+(item.parent===null?'初期声':'#'+(item.parent+1)),document.createElement('br'));
 for(const [i,l] of ['A','B'].entries())a.append(button('▶ '+l,()=>play(item.text,item.voices[i])),button(l+' から分岐',()=>fork(item,i)));$('history').append(a)}
 if(!state.log.length)$('history').textContent='最初の比較を終えると、ここから聴き直せます。';
}
function download(name,data){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
$('skip').onclick=()=>advance(null);$('try').onclick=()=>{if($('custom').value.trim())play($('custom').value.slice(0,60),state.voice)};
$('recipe').onclick=()=>download('idol-voice.json',{...state.voice,engineCommit:version});
$('votes').onclick=()=>download('idol-comparisons.json',{engineCommit:version,comparisons:state.log});
save();render();
</script></html>
