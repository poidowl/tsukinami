name: Hibiki voice regression
on:
  push:
    branches: [hibiki]
  pull_request:
    branches: [hibiki]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check hitofude.mjs
          node --check yomu.mjs
          node --check tools/hibiki_listen.mjs
          node --check b1_akambo.mjs
          node --check b1_yomu.mjs
          node --check b2_akambo.mjs
          node --check b2_yomu.mjs
          node --check b3_akambo.mjs
          node --check b3_yomu.mjs
          node --check b3_kai.mjs
          node --check tools/b3_measure.mjs
          node --check tools/b3_sweep.mjs
          node --check tools/infant_lab.mjs
      - name: Synthesis regression tests
        run: node --test tests/hibiki.test.mjs
      - name: Blind listening pack smoke test
        run: |
          node tools/hibiki_listen.mjs "$RUNNER_TEMP/hibiki_blind"
          test "$(find "$RUNNER_TEMP/hibiki_blind" -maxdepth 1 -name '*.wav' | wc -l)" -eq 21
          test "$(tail -n +2 "$RUNNER_TEMP/hibiki_blind/scores.csv" | wc -l)" -eq 21
      - name: B1 infant babble smoke render
        run: |
          node b1_yomu.mjs --seed 42 --phrases 3 --out "$RUNNER_TEMP/b1.wav"
          test -s "$RUNNER_TEMP/b1.wav"
      - name: B2 embodied babble smoke render
        run: |
          node b2_yomu.mjs --seed 42 --phrases 3 --out "$RUNNER_TEMP/b2.wav"
          node b2_yomu.mjs --seed 42 --profile tuned --out "$RUNNER_TEMP/b2_tuned.wav"
          test -s "$RUNNER_TEMP/b2_tuned.wav"
          node b2_yomu.mjs --seed 42 --profile legacy --out "$RUNNER_TEMP/b2_legacy.wav"
          test -s "$RUNNER_TEMP/b2_legacy.wav"
          node b2_yomu.mjs --seed 42 --mode babble --out "$RUNNER_TEMP/b2_babble.wav"
          test -s "$RUNNER_TEMP/b2_babble.wav"
          test -s "$RUNNER_TEMP/b2.wav"
      - name: B3 synthesis and soroi comparison
        run: |
          node b3_yomu.mjs --seed 42 --profile soroe1 --out "$RUNNER_TEMP/b3_soroe1.wav"
          node b3_yomu.mjs --seed 42 --profile kai --out "$RUNNER_TEMP/b3_kai.wav"
          node b3_yomu.mjs --seed 42 --profile candidate --out "$RUNNER_TEMP/b3_candidate.wav"
          node b3_yomu.mjs --seed 42 --profile soroe2 --out "$RUNNER_TEMP/b3_soroe2.wav"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -loglevel error -y -i samples/reference/infant_2months_stephan.ogg -ar 44100 -ac 1 "$RUNNER_TEMP/infant.wav"
          node tools/b3_measure.mjs "$RUNNER_TEMP/infant.wav" "$RUNNER_TEMP/b3_soroe1.wav" "$RUNNER_TEMP/b3_kai.wav" "$RUNNER_TEMP/b3_candidate.wav" "$RUNNER_TEMP/b3_soroe2.wav"
          node tools/b3_sweep.mjs "$RUNNER_TEMP/infant.wav"
      - name: Multi-reference infant lab smoke
        run: |
          node tools/infant_lab.mjs --reference stephan_2m --budget 4 --out "$RUNNER_TEMP/infant_lab" --seed 20261120
          test "$(find "$RUNNER_TEMP/infant_lab" -name '*.wav' | wc -l)" -eq 4
          test -s "$RUNNER_TEMP/infant_lab/results.json"
          test -s "$RUNNER_TEMP/infant_lab/PROMOTION.md"
          node tools/infant_lab.mjs --reference stephan_2m --sweep correlated --budget 8 --out "$RUNNER_TEMP/infant_corr" --seed 20261120
          test -s "$RUNNER_TEMP/infant_corr/results.json"
          node tools/infant_lab.mjs --reference stephan_5m --budget 4 --out "$RUNNER_TEMP/infant_lab_5m" --seed 20261120
          test -s "$RUNNER_TEMP/infant_lab_5m/results.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infant-reference-lab
          path: ${{ runner.temp }}/infant_lab/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b3-listening-samples
          path: |
            ${{ runner.temp }}/b3_soroe1.wav
            ${{ runner.temp }}/b3_kai.wav
            ${{ runner.temp }}/b3_candidate.wav
            ${{ runner.temp }}/b3_soroe2.wav
          if-no-files-found: ignore
          retention-days: 14
      - name: CLI smoke render
        run: |
          node yomu.mjs --preset hibiki_katari --measure "あさのひかり、ゆめのかけら"
          node yomu.mjs --preset hibiki_yorisoi --measure "おかえり、きょうもはなそう"
